<!doctype html>
<html lang="en">
    <head>
        {% load static %}
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>e-matadanam</title>
        <link rel="stylesheet" href="{% static '/index.css' %}" />
        <style>
            .bgBox {
                flex-direction: column;
                align-items: center;
            }

            .fields {
                display: flex;
                flex-direction: column;
                gap: 20px;
                justify-content: center;
            }

            button {
                background-color: #57468b;
                border: none;
                color: #f9f9f9;
                padding: 0.75rem 1.5rem;
                border-radius: 6px;
                font-size: 1rem;
                cursor: pointer;
                transition: background-color 0.2s ease;
            }

            input {
                height: 2rem;
                border-radius: 0.5rem;
                border: 1px solid black;
            }

            .email,
            .password {
                display: flex;
                flex-direction: column;
                gap: 5px;
            }
        </style>
    </head>
    <body>
        <div class="flexWrapper">
            {% include 'navbar.html' %}
            <div class="bgBox">
                <h1>Register</h1>
                <form method="post">
                    {% csrf_token %}

                    <div id="reader" style="width: 600px"></div>
                    <script src="https://unpkg.com/html5-qrcode"></script>
                    <script>
                        function onScanSuccess(decodedText, decodedResult) {
                            document.getElementById("qr_data").value =
                                decodedText;
                            alert("QR Code Scanned! Now enter your password.");
                            html5QrcodeScanner.clear();
                        }

                        var html5QrcodeScanner = new Html5QrcodeScanner(
                            "reader",
                            {
                                fps: 10,
                                qrbox: 250,
                            },
                        );
                        html5QrcodeScanner.render(onScanSuccess);
                    </script>

                    <input type="hidden" name="qr_data" id="qr_data" />

                    <div class="fields">
                        <div class="email">
                            <label>Email</label>
                            <input type="email" name="email" required />
                        </div>

                        <div class="password">
                            <label>Password</label>
                            <input type="password" name="password" required />
                        </div>

                        <button type="submit">Register</button>
                    </div>
                </form>
            </div>
            <p id="footer">
                © Copyright 2025. All rights reserved with Election Commission
                of India
            </p>
        </div>
    </body>
</html>
