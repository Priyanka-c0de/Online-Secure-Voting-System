{% load static %}
<header class="topContainer">
    <div class="banner">
        <div class="mainEmblem">
            <img src="{% static 'svg/emblemLogo.svg' %}" alt="National Emblem of India" />
            <img src="{% static 'svg/electioncommission.png' %}" alt="Election Commission of India" />
            <div class="brand-text">
                <span class="brand-title">e-<span>Matadanam</span></span>
                <span class="brand-sub">Online Secure Voting System</span>
            </div>
        </div>
        <div class="ecinet">
            <img src="{% static 'svg/ecinet.png' %}" alt="ECINet" />
            <div class="ecinet-text">
                <span class="eci-name">ECINet</span>
                <span class="secure-badge">Secure Portal</span>
            </div>
        </div>
    </div>
    <nav aria-label="Primary navigation">
        <div class="mainNav">
            <a href="/">Home</a>
            {% if user.is_authenticated %}
            <a href="/vote">Vote</a>
            <a href="/results">Results</a>
            <a href="/dashboard">Dashboard</a>
            {% endif %}
        </div>
        <div class="userSpace">
            {% if user.is_authenticated %}
            <div class="welcome">
                <p>Welcome</p>
                <p style="font-weight: bold">{{ user.voter.name }}</p>
            </div>
            <div class="navLogout">
                <img src="{% static 'svg/logout.svg' %}" alt="" />
                <a href="/logout">Logout</a>
            </div>
            {% else %}
            <div class="navLogin">
                <img src="{% static 'svg/login.svg' %}" alt="" />
                <a href="/login">Login</a>
            </div>
            <div class="navRegister">
                <img src="{% static 'svg/register.svg' %}" alt="" />
                <a href="/register">Register</a>
            </div>
            {% endif %}
        </div>
    </nav>
</header>
