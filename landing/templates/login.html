<!doctype html>
<html lang="en">
    <head>
        {% load static %}
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login — e-Matadanam</title>
        <link rel="stylesheet" href="{% static 'index.css' %}" />
    </head>
    <body>
        <div class="flexWrapper">
            {% include 'navbar.html' %}
            <div class="auth-wrap">
                <div class="auth-card">
                    <div class="auth-head">
                        <span class="lock">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                            Secure Sign In
                        </span>
                        <h1>Voter Login</h1>
                        <p>Access your verified e-Matadanam account to cast your vote.</p>
                    </div>
                    <div class="auth-body">
                        <form method="post">
                            {% csrf_token %} {{ form.as_p }}
                            <button type="submit" class="btn btn-block">Login</button>
                        </form>
                        <p class="auth-alt">
                            New to e-Matadanam?
                            <a href="/register">Register to vote</a>
                        </p>
                    </div>
                </div>
            </div>
            <p id="footer">
                <span class="foot-strip"></span>
                © Copyright 2025. All rights reserved with Election Commission
                of India
            </p>
        </div>
    </body>
</html>
